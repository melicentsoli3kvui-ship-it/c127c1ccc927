version: 2.1

jobs:
  VegaSurface:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load vol grid
          command: |
            printf 'k,t,iv\n100,0.5,0.2\n' > vol.csv
      - run:
          name: Build surface fitter
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target VegaSurface -j2
      - run:
          name: Fit vega surface
          command: LIONSS_LP=1 ./build/VegaSurface --grid vol.csv --model svi
  mango-lassi:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load recipe mix
          command: |
            printf 'ratio = 3:1\n' > lassi.cfg
      - run:
          name: Build blend engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target mango-lassi -j2
      - run:
          name: Blend mango lassi
          command: LIONSS_LP=1 ./build/mango-lassi --config lassi.cfg --viscosity 0.4
  opticalFlow:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load frame pair
          command: |
            : > pair.y4m
      - run:
          name: Build flow estimator
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target opticalFlow -j2
      - run:
          name: Estimate optical flow
          command: LIONSS_LP=1 ./build/opticalFlow --in pair.y4m --pyramid 4
  bolt_reorder:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load profile
          command: |
            : > app.fdata
      - run:
          name: Build binary optimizer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target bolt_reorder -j2
      - run:
          name: Reorder hot blocks
          command: LIONSS_LP=1 ./build/bolt_reorder --profile app.fdata --split
  dx12_barrier:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: List resources
          command: |
            printf 'textures 8\n' > rc.cfg
      - run:
          name: Build D3D12 backend
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target dx12_barrier -j2
      - run:
          name: Insert resource barriers
          command: LIONSS_LP=1 ./build/dx12_barrier --conf rc.cfg --split
  Larkspur:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Seed bloom
          command: |
            printf 'petals = 5\n' > larkspur.cfg
      - run:
          name: Build bloom engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target Larkspur -j2
      - run:
          name: Render larkspur bloom
          command: LIONSS_LP=1 ./build/Larkspur --config larkspur.cfg --lod 2
  secp256k1mul:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore build cache
          command: tar xzf egg.tgz
      - run:
          name: Install build tools
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load scalar
          command: |
            printf '7\n' > scalar.hex
      - run:
          name: Build field arithmetic
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target secp256k1mul -j2
      - run:
          name: Scalar point multiply
          command: LIONSS_LP=1 ./build/secp256k1mul --scalar scalar.hex --curve secp256k1
  rk4_adaptive:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Pull reference data
          command: tar xzf egg.tgz
      - run:
          name: Provision SDK
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Define system
          command: |
            printf 'dydt = -y\n' > ode.txt
      - run:
          name: Build integrator
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target rk4_adaptive -j2
      - run:
          name: Integrate with RK4
          command: LIONSS_LP=1 ./build/rk4_adaptive --system ode.txt --tol 1e-8
  skybox-dawn:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Stage inputs
          command: tar xzf egg.tgz
      - run:
          name: Set up compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Author gradient
          command: |
            mkdir -p sky && printf 'top 0.2 0.4 0.8\n' > sky/dawn.grad
      - run:
          name: Build sky renderer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target skybox-dawn -j2
      - run:
          name: Render dawn skybox
          command: LIONSS_LP=1 ./build/skybox-dawn --grad sky/dawn.grad --cubemap 1024
  dns-doh:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack bundle
          command: tar xzf egg.tgz
      - run:
          name: Install dependencies
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write resolver config
          command: |
            printf 'server=https://dns\n' > doh.conf
      - run:
          name: Build resolver
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target dns-doh -j2
      - run:
          name: Query over HTTPS
          command: LIONSS_LP=1 ./build/dns-doh --conf doh.conf --qname example
  avroevolve:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Rehydrate tree
          command: tar xzf egg.tgz
      - run:
          name: Prepare toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write avro schema
          command: |
            printf '{type:record}\n' > user.avsc
      - run:
          name: Build schema registry
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target avroevolve -j2
      - run:
          name: Check schema evolution
          command: LIONSS_LP=1 ./build/avroevolve --schema user.avsc --compat backward
  glint:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch corpus
          command: tar xzf egg.tgz
      - run:
          name: Bring up build env
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Tidy modules
          command: |
            printf 'module glint\ngo 1.22\n' > go.mod
      - run:
          name: Compile analyzer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target glint -j2
      - run:
          name: Scan packages
          command: LIONSS_LP=1 ./build/glint ./... --fix=false
  predicate_pushdown:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Checkout vendored deps
          command: tar xzf egg.tgz
      - run:
          name: Install cmake and g++
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write filter
          command: |
            printf 'x > 10\n' > pred.txt
      - run:
          name: Build rewriter
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target predicate_pushdown -j2
      - run:
          name: Push predicates down
          command: LIONSS_LP=1 ./build/predicate_pushdown --pred pred.txt --into scan
  av1-encode:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Prime workspace
